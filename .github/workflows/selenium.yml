name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Chrome and Firefox are preinstalled on the runner; Selenium Manager fetches the drivers.
      - name: Run tests
        run: ./mvnw -B test -Dbrowser=${{ matrix.browser }} -Dheadless=true
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: reports/
          retention-days: 30

  publish:
    name: publish reports to GitHub Pages
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: site
          pattern: report-*
      - name: Index page linking both browser reports
        run: |
          cd site
          mv report-chrome chrome
          mv report-firefox firefox
          cat > index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>OrangeHRM Selenium reports</title>
          <style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem}a{display:block;margin:.6rem 0;font-size:1.2rem}</style>
          <h1>OrangeHRM Selenium reports</h1>
          <p>Latest run on <code>main</code>, one report per browser.</p>
          <a href="chrome/index.html">Chrome report</a>
          <a href="firefox/index.html">Firefox report</a>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
